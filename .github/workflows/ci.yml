name: VOXEDIT-AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        
    - name: Run Pytest
      run: |
        cd backend
        pytest tests/
        
  build-go-gateway:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: false
        
    - name: Build Gateway
      run: |
        cd gateway
        go build -v ./...
        
  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend, build-go-gateway]
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker Compose Services
      run: docker-compose build
